[project]
name = "inventarios-produccion"
version = "0.1.0"
description = "App de planificación y control de inventarios"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "openpyxl>=3.1.5",
]

[project.scripts]
inventarios-produccion = "inventarios_produccion:main"

[tool.uv]
src = "src"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
