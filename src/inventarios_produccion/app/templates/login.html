{% extends "base.html" %}

{% block title %}Iniciar Sesión - Planificación de Inventarios{% endblock %}

{% block content %}
<div class="welcome-banner">
    <strong>Acceso al Sistema</strong>
</div>

<div class="card card-compact" style="max-width: 480px; margin: 0 auto;">
    <h1 class="page-title" style="text-align: center; margin-bottom: 1.75rem; font-size: 2.5rem;">Iniciar Sesión</h1>

    <form method="POST" action="/login">
        <div style="margin-bottom: 1.5rem;">
            <label for="usuario" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--azul-marino-suave); font-family: 'Lora', serif;">Usuario</label>
            <input type="text" id="usuario" name="usuario" required
                   style="width: 100%; padding: 0.9rem 1rem; border: 1px solid var(--borde-suave); border-radius: 8px; font-size: 1rem; box-sizing: border-box; font-family: 'Lora', serif; background: #ffffff;">
        </div>
        <div style="margin-bottom: 2rem;">
            <label for="clave" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--azul-marino-suave); font-family: 'Lora', serif;">Contraseña</label>
            <input type="password" id="clave" name="clave" required
                   style="width: 100%; padding: 0.9rem 1rem; border: 1px solid var(--borde-suave); border-radius: 8px; font-size: 1rem; box-sizing: border-box; font-family: 'Lora', serif; background: #ffffff;">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem;">Ingresar</button>
    </form>
</div>
{% endblock %}
